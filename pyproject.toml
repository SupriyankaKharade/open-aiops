[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-aiops"
version = "0.1.0"
description = "Open-source control plane for resilient, observable, and governed AI agent fleets."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "OpenAIOps Contributors"}
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
